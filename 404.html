<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Zurena</title>
<meta name="description" content="The page you asked for could not be found on Zurena by Zuber. Go back to the home page.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{color-scheme:light dark;--bg:#F6F3EC;--ink:#16150F;--mute:#5A5850;--line:#8C877A}
@media(prefers-color-scheme:dark){:root{--bg:#11130F;--ink:#F1EEE6;--mute:#A9A699}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:44rem;margin:0 auto;padding:clamp(3rem,12vw,8rem) 1.5rem}
h1{font:400 clamp(2.6rem,9vw,5.5rem)/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:.4rem 0 1rem}
p{color:var(--mute);max-width:46ch}
a.b{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none}
a.b:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main id="main">
  <p>Error 404</p>
  <h1>That page does not exist.</h1>
  <p>The link may be old or mistyped. Go back to the home page or open the work.</p>
  <p><a class="b" href="/">Back to Zurena</a> &nbsp; <a href="/work">See the work</a></p>
</main>
</body>
</html>

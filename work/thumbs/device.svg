    <g fill="#4F8CFF"><circle cx="310" cy="0" r="22"/><circle cx="310" cy="0" r="22" filter="url(#b)" opacity=".6"/></g>
    <g fill="#4F8CFF" opacity=".35"><circle cx="410" cy="0" r="22"/></g>
    <g fill="#EDEAE2"><circle cx="510" cy="0" r="22"/><circle cx="510" cy="0" r="22" filter="url(#b)" opacity=".5"/></g>
    <g fill="#F2A33A"><circle cx="610" cy="0" r="22"/><circle cx="610" cy="0" r="22" filter="url(#b)" opacity=".6"/></g>
    <g fill="#FF4B1F"><circle cx="710" cy="0" r="22"/><circle cx="710" cy="0" r="22" filter="url(#b)" opacity=".7"/></g>
  </g>
  <g stroke="#EDEAE2" stroke-opacity=".5" stroke-width="2" fill="none"><path d="M110 330v22M210 330v22M310 330v22M410 330v22M510 330v22M610 330v22M710 330v22"/></g>
